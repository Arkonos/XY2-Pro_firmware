#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#
# STM32F1 Architecture with unified STM32 HAL
#
# Naming Example: STM32F103RCT6
#
#   F : Foundation (sometimes High Performance F2/F4)
#   1 : Cortex M3 core (0:M0, 1-2:M3, 3-4:M4, 7:M7)
#  03 : Line/Features
#   R : 64 or 66 pins  (T:36, C:48, V:100, Z:144, I:176)
#   C : 256KB Flash-memory  (B: 128KB, D:384KB, E:512KB, G:1024KB)
#   T : LQFP package
#   6 : -40...85°C   (7: ...105°C)
#
#################################

[common_STM32F103RC_variant]
extends              = stm32_variant
board                = genericSTM32F103RC
board_build.variant  = MARLIN_F103Rx
build_flags          = ${stm32_variant.build_flags} -DDEBUG_LEVEL=0
monitor_speed        = 115200

#
# STM32F103RE
#
[env:STM32F103RE]
extends       = common_stm32
board         = genericSTM32F103RE
monitor_speed = 115200

#
# STM32F103VE
#
[env:STM32F103VE]
extends       = common_stm32
board         = genericSTM32F103VE
monitor_speed = 115200

#
# STM32F103ZE
#
[env:STM32F103ZE]
extends       = common_stm32
board         = genericSTM32F103ZE
monitor_speed = 115200

#
# MCU: STM32F103ZET6
#
[env:tronxy_stm32f103]
extends              = stm32_variant
board                = tronxy_stm32f103zet
board_build.offset   = 0x10000
board_build.ldscript = buildroot/share/PlatformIO/variants/tronxy_stm32f103z/ldscript.ld
build_src_filter           = ${common_stm32.build_src_filter} 
  +<chenyun>
  +<mcu>
build_flags          = ${stm32_variant.build_flags} ${my_proj.build_flags}
  -DSTM32F1xx -DSTM32_XL_DENSITY
  -IMarlin/mcu/stm32f103zet
build_unflags        = ${stm32_variant.build_unflags} -fno-rtti
extra_scripts        = ${stm32_variant.extra_scripts}
                       buildroot/share/PlatformIO/scripts/tronxy_scrypt.py
